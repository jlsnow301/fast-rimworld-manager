name: Code Quality

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    code-quality:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
            - name: Check formatting
              run: deno fmt --check --ignore=.agents --ignore=.claude --ignore=plans --ignore=README.md --ignore=AGENTS.md
            - name: Lint
              run: deno lint
            - name: Test
              run: deno task test
